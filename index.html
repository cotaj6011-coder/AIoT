<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劉長村 — 個人儀表板與即時時鐘</title>
  <meta name="description" content="劉長村的個人專屬網頁，AIoT & 軟體開發工程師，具備高精準度即時跳秒時鐘與動態資訊卡片。">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1" id="glow1"></div>
  <div class="ambient-glow glow-2" id="glow2"></div>
  <div class="ambient-glow glow-3" id="glow3"></div>

  <main class="container">
    <div class="glass-card" id="mainCard">
      <!-- Card Header: Status & Controls -->
      <header class="card-header">
        <div class="status-pill" id="statusBadge" title="目前狀態">
          <span class="status-dot"></span>
          <span class="status-text" id="statusText">在線</span>
        </div>

        <div class="control-group">
          <!-- 12h / 24h Toggle -->
          <button class="pill-btn" id="formatToggle" type="button" aria-label="切換 12小時 / 24小時制">
            <span class="btn-label" id="formatLabel">24小時制</span>
          </button>
          <!-- Language Toggle -->
          <button class="pill-btn" id="langToggle" type="button" aria-label="切換語言 (繁體中文 / English)">
            <span class="btn-label" id="langLabel">中文</span>
          </button>
        </div>
      </header>

      <!-- Identity & Greeting Section -->
      <section class="profile-section">
        <div class="greeting-badge" id="greetingBadge">
          <span class="greeting-icon" id="greetingIcon">🌙</span>
          <span class="greeting-text" id="greetingText">晚安，</span>
        </div>
        
        <h1 class="hero-name" id="heroName">劉長村</h1>
        <p class="hero-subtitle" id="heroSubtitle">AIoT & 軟體開發工程師</p>
      </section>

      <!-- Precision Clock Section -->
      <section class="clock-section" aria-label="即時數位時鐘">
        <div class="clock-display" id="clockDisplay">
          <div class="time-main">
            <span class="time-digits" id="timeHours">20</span>
            <span class="time-colon" id="colon1">:</span>
            <span class="time-digits" id="timeMinutes">00</span>
          </div>
          <div class="time-aside">
            <span class="time-seconds" id="timeSeconds">00</span>
            <span class="time-period" id="timePeriod"></span>
          </div>
        </div>

        <!-- Live second progression bar -->
        <div class="second-meter" aria-hidden="true">
          <div class="second-meter-fill" id="secondProgress"></div>
        </div>

        <!-- Date & Timezone Metadata -->
        <div class="meta-row">
          <div class="date-badge" id="dateBadge">
            <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span id="dateText">2026年9月16日 星期三</span>
          </div>

          <div class="timezone-badge" id="timezoneBadge">
            <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span id="timezoneText">GMT+8 · Taipei</span>
          </div>
        </div>
      </section>

      <!-- Action Links Footer -->
      <footer class="card-footer">
        <a href="https://github.com/cotaj6011-coder" target="_blank" rel="noopener noreferrer" class="action-btn github-btn" id="githubLink" aria-label="造訪 劉長村 的 GitHub 主頁">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span class="btn-text" id="githubBtnText">GitHub 主頁</span>
        </a>

        <a href="mailto:cotaj6011@gmail.com" class="action-btn email-btn" id="emailLink" aria-label="寄送 Email 給 劉長村">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <span class="btn-text" id="emailBtnText">電子信箱</span>
        </a>
      </footer>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
